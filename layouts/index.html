{{ partial "header.html" . }}
{{- $home := .Site.Data.home }}

<main class="home">

  {{- with $home.hero }}
  <section class="home-hero" aria-label="Apache Camel">
    <div class="home-hero-copy">
      <p class="home-hero-badge">{{ .eyebrow }}</p>
      <h1>{{ .title }}</h1>
      <p class="home-hero-tagline">{{ .tagline }}</p>
      <p class="home-hero-lead">{{ .lead }}</p>
      <p class="home-hero-actions">
        <a class="button dark" href="{{ .primary_cta.url | relURL }}">{{ .primary_cta.label }}</a>
        <a class="button light" href="{{ .secondary_cta.url | relURL }}">{{ .secondary_cta.label }}</a>
      </p>
      <div class="home-cli" data-home-copy>
        <code class="home-cli-command"><span class="home-cli-prompt">$</span> {{ .command }}</code>
        <button class="home-cli-copy" type="button" data-command="{{ .command }}">Copy</button>
      </div>
    </div>
    <div class="home-hero-art">
      <img src="{{ path.Join "_" (index site.Data "rev-manifest" "img/logo-d.svg") | relURL }}" alt="Apache Camel">
    </div>
  </section>
  {{- end }}

</main>

{{ partial "footer.html" . }}
