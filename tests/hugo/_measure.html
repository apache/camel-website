<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>measure</title>
<style>
  html, body { margin: 0; }
  iframe { height: 2400px; border: 0; }
</style>
</head>
<body>
<iframe id="frame" title="measured page"></iframe>
<pre id="out">pending</pre>
<script>
  // Hash format: <path>|<selector>@<prop>,<prop>;<selector>@<prop>|<click-selector>|<width>
  // The optional third segment names an element to click inside the iframe
  // before the queries are evaluated, so a measurement can capture state
  // after an interaction instead of only the state after initial load.
  // The optional fourth segment sets the iframe width (default 1440), so a
  // breakpoint other than desktop can be measured.
  var raw = decodeURIComponent(window.location.hash.slice(1))
  var parts = raw.split('|')
  var path = parts[0] || '/'
  var queries = (parts[1] || '').split(';').filter(Boolean)
  var clickSelector = parts[2] || ''
  var width = parts[3] || '1440'
  var frame = document.getElementById('frame')
  frame.style.width = width + 'px'
  frame.onload = function () {
    var doc = frame.contentDocument
    var win = frame.contentWindow
    var clickLines = []
    if (clickSelector) {
      var target = doc.querySelector(clickSelector)
      if (!target) {
        clickLines.push(clickSelector + ' => NOT FOUND (click target)')
      } else {
        target.click()
      }
    }
    var lines = queries.map(function (query) {
      var bits = query.split('@')
      var selector = bits[0]
      var props = (bits[1] || '').split(',').filter(Boolean)
      var el = doc.querySelector(selector)
      if (!el) return selector + ' => NOT FOUND'
      var cs = win.getComputedStyle(el)
      var rect = el.getBoundingClientRect()
      var out = props.map(function (p) { return p + '=' + cs.getPropertyValue(p) })
      out.push('box=' + Math.round(rect.width) + 'x' + Math.round(rect.height))
      out.push('at=' + Math.round(rect.left) + ',' + Math.round(rect.top))
      return selector + ' => ' + out.join(' ')
    })
    document.getElementById('out').textContent = clickLines.concat(lines).join('\n') || 'no queries'
  }
  frame.src = path
</script>
</body>
</html>
